# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Disable deep sleep for stability
CONFIG_ZMK_SLEEP=n

# Note: Do not force Zephyr power management off here,
# some dependencies may select it and cause Kconfig warnings.

# Allow more concurrent connections just in case
# Keep within Zephyr's default range to avoid warnings
CONFIG_BT_MAX_CONN=5

# Add margin to Bluetooth RX stack
CONFIG_BT_RX_STACK_SIZE=2048

# Add margin to system workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y

# Enable RGB LED Widget for XIAO BLE onboard LED
CONFIG_RGBLED_WIDGET=y
